color:
  palette:
    red: "#FF0000"
    black: "#002040"
    white: "#FFE0C0"
  primary: red
  foreground: black
  background: white

typography:
  fonts:
    - source: google
      family: Baskerville
      weight: [200, 400]
      style: [normal, italic]
    - source: google
      family: Montserrat
      weight: [400, 700, 900]
      style: [normal, italic]
    - source: google
      family: Inconsolata
      weight: [400, 600]
    - source: google
      family: Roboto Slab
      weight: [400]
  base:
    family: Baskerville
    style: italic
    weight: 200
    color: "#080180"
    line-height: 1.5
  headings:
    family: Montserrat
    weight: 800
    color: "#0b8005"
    style: normal # because base is italic
  monospace:
    family: Inconsolata
    style: normal
  monospace-inline:
    weight: 600
    color: rgb(8, 111, 15)
    background-color: rgb(255, 250, 224)
  monospace-block:
    color: mintcream
    background-color: "#77aae1"
    line-height: 2.5
  link:
    family: "Roboto Slab"
    color: maroon
    decoration: underline
