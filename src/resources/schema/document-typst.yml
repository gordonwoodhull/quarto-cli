- name: logo
  schema:
    ref: logo-light-dark-specifier-path-optional
  tags:
    formats: [typst]
  description: "The logo image."

- name: margin-geometry
  schema:
    object:
      closed: true
      properties:
        inner-far:
          string:
            description: "Distance from inner (left) page edge to wideblock boundary."
        inner-width:
          string:
            description: "Width of inner margin note column (typically 0 for no notes on left)."
        inner-sep:
          string:
            description: "Gap between inner margin and body text."
        outer-far:
          string:
            description: "Distance from outer (right) page edge to wideblock boundary."
        outer-width:
          string:
            description: "Width of outer margin note column."
        outer-sep:
          string:
            description: "Gap between body text and outer margin notes."
        clearance:
          string:
            description: "Minimum vertical spacing between margin notes (default: 8pt)."
  tags:
    formats: [typst]
  description:
    short: "Advanced geometry settings for Typst margin layout."
    long: |
      Fine-grained control over marginalia package geometry. Most users should
      use `margin` and `grid` options instead; these values are computed automatically.

      User-specified values override the computed defaults.
